<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Noxy.NET.MediaPlayer.App</title>
    <base href="/"/>
    <script>try {
        if (localStorage.theme) document.documentElement.setAttribute("theme", localStorage.theme);
    } catch (e) {
    }</script>
    <script>
        // A file dropped anywhere on the page would make the web view open it. Only a file input may take a drop: a drop zone puts one over itself while files are dragged across it.
        const isFileDrag = e => e.dataTransfer !== null && e.dataTransfer.types.includes("Files");
        const attributeFileDrag = "data-file-drag";

        // While files are dragged over the window the root element says so, and the file inputs of the drop zones cover their zones at once. Waiting for the app to answer the first dragenter would leave the drag with "can't drop here" until then.
        window.addEventListener("dragenter", e => {
            if (isFileDrag(e)) document.documentElement.setAttribute(attributeFileDrag, "");
        }, true);
        window.addEventListener("dragleave", e => {
            const isOutside = e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight;
            if (isFileDrag(e) && isOutside) document.documentElement.removeAttribute(attributeFileDrag);
        }, true);
        window.addEventListener("dragend", () => document.documentElement.removeAttribute(attributeFileDrag), true);

        window.addEventListener("dragover", e => {
            if (isFileDrag(e) && e.target.type !== "file") {
                e.preventDefault();
                e.dataTransfer.dropEffect = "none";
            }
        });
        window.addEventListener("drop", e => {
            document.documentElement.removeAttribute(attributeFileDrag);
            if (isFileDrag(e) && e.target.type !== "file") e.preventDefault();
        }, true);
    </script>
    <link rel="stylesheet" href="css/app.css"/>
    <link rel="stylesheet" href="css/breakpoints.css"/>
    <link rel="stylesheet" href="css/variables.css"/>
    <link rel="stylesheet" href="Noxy.NET.MediaPlayer.App.styles.css"/>
    <link rel="icon" href="data:,">
</head>

<body>

<div class="status-bar-safe-area"></div>

<div id="app">Loading...</div>

<div id="blazor-error-ui" data-nosnippet>
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">🗙</span>
</div>

<script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
